<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单 - 闲置好物</title>
    <script src="/auth-utils.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6366F1; --secondary: #8B5CF6; --success: #10B981;
            --warning: #F59E0B; --error: #EF4444; --bg: #F8FAFC;
            --card-bg: #FFFFFF; --text: #1E293B; --text-light: #64748B;
            --border: #E2E8F0; --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }

        .header { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 0.875rem 1rem; position: sticky; top: 0; z-index: 99; }
        .header-content { max-width: 800px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
        .back-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 0.5rem 1rem; border-radius: 2rem; cursor: pointer; font-size: 0.9rem; }
        .back-btn:hover { background: rgba(255,255,255,0.3); }
        .page-title { font-size: 1.1rem; font-weight: 600; }

        .tabs { background: white; display: flex; border-bottom: 1px solid var(--border); position: sticky; top: 60px; z-index: 98; }
        .tab { flex: 1; padding: 1rem; text-align: center; font-size: 0.9rem; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

        .main { max-width: 800px; margin: 0 auto; padding: 1rem; }

        .orders-list { display: flex; flex-direction: column; gap: 1rem; }

        .order-card { background: white; border-radius: 1rem; overflow: hidden; box-shadow: var(--shadow); cursor: pointer; }
        .order-card:hover { box-shadow: 0 8px 15px -3px rgba(0,0,0,0.1); }

        .order-header { display: flex; justify-content: space-between; align-items: center; padding: 1rem; border-bottom: 1px solid var(--border); }
        .order-no { font-size: 0.85rem; color: var(--text-light); }
        .order-status { padding: 0.25rem 0.75rem; border-radius: 1rem; font-size: 0.8rem; font-weight: 600; }
        .order-status.pending { background: rgba(245,158,11,0.1); color: var(--warning); }
        .order-status.accepted { background: rgba(99,102,241,0.1); color: var(--primary); }
        .order-status.shipped { background: rgba(16,185,129,0.1); color: var(--success); }
        .order-status.completed { background: rgba(16,185,129,0.2); color: var(--success); }
        .order-status.rejected, .order-status.cancelled { background: rgba(239,68,68,0.1); color: var(--error); }

        .order-product { display: flex; gap: 1rem; padding: 1rem; border-bottom: 1px solid var(--border); }
        .product-img { width: 80px; height: 80px; border-radius: 0.5rem; object-fit: cover; background: var(--bg); }
        .product-info { flex: 1; }
        .product-title { font-weight: 500; font-size: 0.95rem; margin-bottom: 0.5rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-price { color: var(--error); font-weight: 600; }
        .product-role { font-size: 0.8rem; padding: 0.125rem 0.5rem; border-radius: 1rem; margin-left: 0.5rem; }
        .product-role.buyer { background: rgba(99,102,241,0.1); color: var(--primary); }
        .product-role.seller { background: rgba(16,185,129,0.1); color: var(--success); }

        .order-footer { display: flex; justify-content: space-between; align-items: center; padding: 1rem; }
        .order-time { font-size: 0.8rem; color: var(--text-light); }
        .order-action { padding: 0.5rem 1rem; border-radius: 1.5rem; font-size: 0.85rem; cursor: pointer; border: none; }
        .order-action.primary { background: var(--primary); color: white; }
        .order-action.secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }

        .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-light); }
        .empty-icon { font-size: 3rem; margin-bottom: 1rem; }

        .loading { text-align: center; padding: 2rem; color: var(--text-light); }

        .address-badge { background: var(--bg); padding: 0.5rem 1rem; margin: 0 1rem 1rem 1rem; border-radius: 0.5rem; font-size: 0.85rem; }
        .address-label { color: var(--text-light); margin-right: 0.5rem; }
        .express-info { margin-top: 0.25rem; }
        
        .fund-status { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 0.5rem; font-size: 0.75rem; margin-left: 0.5rem; }
        .fund-status.pending { background: rgba(100,116,139,0.1); color: #64748B; }
        .fund-status.held { background: rgba(245,158,11,0.1); color: var(--warning); }
        .fund-status.released { background: rgba(16,185,129,0.1); color: var(--success); }
        .fund-status.refunded { background: rgba(100,116,139,0.1); color: #64748B; }
        
        .fund-hint { font-size: 0.75rem; color: var(--text-light); margin-top: 0.25rem; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <button class="back-btn" onclick="goBack()">← 返回</button>
            <span class="page-title">我的订单</span>
            <div style="width: 60px;"></div>
        </div>
    </header>

    <div class="tabs">
        <div class="tab active" data-tab="all" onclick="switchTab('all')">全部</div>
        <div class="tab" data-tab="pending" onclick="switchTab('pending')">待处理</div>
        <div class="tab" data-tab="accepted" onclick="switchTab('accepted')">待发货</div>
        <div class="tab" data-tab="shipped" onclick="switchTab('shipped')">待收货</div>
        <div class="tab" data-tab="completed" onclick="switchTab('completed')">已完成</div>
    </div>

    <main class="main">
        <div class="orders-list" id="ordersList">
            <div class="loading">加载中...</div>
        </div>
    </main>

    <script>
        let allOrders = [];
        let currentTab = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            checkLoginAndLoad();
        });

        // Toast 提示
        function showToast(message) {
            const existing = document.getElementById('toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.id = 'toast';
            toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:white;padding:12px 24px;border-radius:8px;z-index:9999;font-size:14px;';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
        
        function showError(message) {
            showToast(message);
        }

        async function checkLoginAndLoad() {
            const loggedIn = await checkLoggedIn();
            if (!loggedIn) {
                window.location.href = '/auth';
                return;
            }
            loadOrders();
        }

        async function loadOrders() {
            try {
                const res = await authFetch('/api/orders');
                console.log('Orders response status:', res.status);
                
                const data = await res.json();
                console.log('Orders response data:', data);
                
                if (data.success) {
                    allOrders = data.orders || [];
                    renderOrders();
                } else {
                    showError('加载失败: ' + (data.error || '未知错误'));
                }
            } catch (e) {
                console.error('Load orders error:', e);
                showError('网络错误: ' + e.message);
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
            renderOrders();
        }

        function renderOrders() {
            const container = document.getElementById('ordersList');
            
            let orders = allOrders;
            if (currentTab !== 'all') {
                if (currentTab === 'pending') {
                    orders = allOrders.filter(o => ['pending', 'accepted'].includes(o.status));
                } else {
                    orders = allOrders.filter(o => o.status === currentTab);
                }
            }

            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📦</div>
                        <div>暂无相关订单</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = orders.map(order => `
                <div class="order-card" onclick="viewOrder(${order.id})">
                    <div class="order-header">
                        <span class="order-no">订单号：${order.id}</span>
                        <span class="order-status ${order.status}">${getStatusText(order.status)}</span>
                    </div>
                    <div class="order-product">
                        <img class="product-img" src="${getFirstImage(order.images)}" alt="">
                        <div class="product-info">
                            <div class="product-title">
                                ${order.title}
                                <span class="product-role ${order.is_buyer ? 'buyer' : 'seller'}">${order.is_buyer ? '买入' : '卖出'}</span>
                            </div>
                            <div class="product-price">¥${order.product_price}</div>
                            ${order.fund_status ? `<div class="fund-hint">${getFundStatusText(order.fund_status)}</div>` : ''}
                        </div>
                    </div>
                    ${order.full_address ? `
                        <div class="address-badge">
                            <span class="address-label">收货地址：</span>${order.full_address}
                        </div>
                    ` : ''}
                    ${order.express_no ? `
                        <div class="address-badge">
                            <span class="address-label">快递信息：</span>${order.express_company} ${order.express_no}
                        </div>
                    ` : ''}
                    <div class="order-footer">
                        <span class="order-time">${formatTime(order.created_at)}</span>
                        ${getActionButton(order)}
                    </div>
                </div>
            `).join('');
        }

        function getStatusText(status) {
            const map = {
                pending: '待确认',
                accepted: '已接单',
                rejected: '已拒绝',
                shipped: '已发货',
                completed: '已完成',
                cancelled: '已取消',
                paid: '已支付'
            };
            return map[status] || status;
        }

        function getFundStatusText(fund_status) {
            const map = {
                pending: '资金待托管',
                held: '资金托管中',
                released: '已打款给卖家',
                refunded: '已退款'
            };
            return map[fund_status] || '';
        }

        function getActionButton(order) {
            // 资金托管流程的操作按钮
            if (order.is_seller) {
                // 卖家操作
                if (order.status === 'pending') {
                    return `<button class="order-action primary" onclick="event.stopPropagation(); acceptOrder(${order.id})">接单</button>
                            <button class="order-action secondary" onclick="event.stopPropagation(); cancelOrder(${order.id})">拒绝</button>`;
                } else if (order.status === 'paid') {
                    // 已付款，资金托管中，卖家发货
                    return `<button class="order-action primary" onclick="event.stopPropagation(); shipOrder(${order.id})">填写快递发货</button>`;
                } else if (order.status === 'shipped' || order.status === 'completed') {
                    // 已发货或已完成，等待买家确认
                    return '';
                }
            } else {
                // 买家操作
                if (order.status === 'pending') {
                    // 待卖家确认前，买家可以取消
                    return `<button class="order-action primary" onclick="event.stopPropagation(); payOrder(${order.id})">确认购买</button>
                            <button class="order-action secondary" onclick="event.stopPropagation(); cancelOrder(${order.id})">取消</button>`;
                } else if (order.status === 'paid') {
                    // 已付款(资金托管中)，等待卖家发货
                    return '<span style="color: var(--warning); font-size: 0.85rem;">等待卖家发货...</span>';
                } else if (order.status === 'shipped') {
                    // 已发货，买家确认收货后资金打给卖家
                    return `<button class="order-action primary" onclick="event.stopPropagation(); completeOrder(${order.id})">确认收货</button>`;
                }
            }
            return '';
        }

        function viewOrder(orderId) {
            window.location.href = `/order?id=${orderId}`;
        }

        async function acceptOrder(orderId) {
            if (!confirm('确认接单？接单后请及时发货')) return;
            
            try {
                const res = await authFetch(`/api/orders/${orderId}/update`, {
                    method: 'POST',
                    body: JSON.stringify({ status: 'paid' })
                });
                const data = await res.json();
                
                if (data.success) {
                    alert('已接单！等待买家付款');
                    loadOrders();
                } else {
                    alert(data.error || '操作失败');
                }
            } catch (e) {
                alert('网络错误');
            }
        }

        async function payOrder(orderId) {
            if (!confirm('确认购买此商品？付款后资金将由平台托管，确认收货后才会打给卖家。')) return;
            
            try {
                const res = await authFetch(`/api/orders/${orderId}/update`, {
                    method: 'POST',
                    body: JSON.stringify({ status: 'paid' })
                });
                const data = await res.json();
                
                if (data.success) {
                    alert('付款成功！资金已由平台托管，等待卖家发货');
                    loadOrders();
                } else {
                    alert(data.error || '操作失败');
                }
            } catch (e) {
                alert('网络错误');
            }
        }

        async function rejectOrder(orderId) {
            if (!confirm('确认拒绝此订单？')) return;
            
            try {
                const res = await authFetch(`/api/orders/${orderId}/update`, {
                    method: 'POST',
                    body: JSON.stringify({ status: 'cancelled' })
                });
                const data = await res.json();
                
                if (data.success) {
                    alert('已接受订单');
                    loadOrders();
                } else {
                    alert(data.error || '操作失败');
                }
            } catch (e) {
                alert('网络错误');
            }
        }

        async function rejectOrder(orderId) {
            if (!confirm('确认拒绝此订单？')) return;
            
            try {
                const res = await authFetch(`/api/orders/${orderId}/reject`, { method: 'POST' });
                const data = await res.json();
                
                if (data.success) {
                    alert('已拒绝订单');
                    loadOrders();
                } else {
                    alert(data.error || '操作失败');
                }
            } catch (e) {
                alert('网络错误');
            }
        }

        async function cancelOrder(orderId) {
            if (!confirm('确认取消此订单？')) return;
            
            try {
                const res = await authFetch(`/api/orders/${orderId}/update`, {
                    method: 'POST',
                    body: JSON.stringify({ status: 'cancelled' })
                });
                const data = await res.json();
                
                if (data.success) {
                    alert('订单已取消');
                    loadOrders();
                } else {
                    alert(data.error || '操作失败');
                }
            } catch (e) {
                alert('网络错误');
            }
        }

        async function shipOrder(orderId) {
            window.location.href = `/order?id=${orderId}&action=ship`;
        }

        async function completeOrder(orderId) {
            if (!confirm('确认收货？确认后资金将打给卖家。')) return;
            
            try {
                const res = await authFetch(`/api/orders/${orderId}/update`, {
                    method: 'POST',
                    body: JSON.stringify({ status: 'completed' })
                });
                const data = await res.json();
                
                if (data.success) {
                    alert('交易完成！卖家已收到货款');
                    loadOrders();
                } else {
                    alert(data.error || '操作失败');
                }
            } catch (e) {
                alert('网络错误');
            }
        }

        function formatTime(timeStr) {
            const date = new Date(timeStr);
            return date.toLocaleString('zh-CN');
        }

        function getFirstImage(images) {
            if (!images) return 'https://picsum.photos/80/80';
            if (typeof images === 'string') {
                try {
                    const arr = JSON.parse(images);
                    return arr[0] || 'https://picsum.photos/80/80';
                } catch {
                    return images || 'https://picsum.photos/80/80';
                }
            }
            return images[0] || 'https://picsum.photos/80/80';
        }

        function goBack() {
            window.location.href = '/';
        }
    </script>
</body>
</html>

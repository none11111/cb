<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单详情 - 闲置好物</title>
    <script src="/auth-utils.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6366F1; --secondary: #8B5CF6; --success: #10B981;
            --warning: #F59E0B; --error: #EF4444; --bg: #F8FAFC;
            --card-bg: #FFFFFF; --text: #1E293B; --text-light: #64748B;
            --border: #E2E8F0; --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }

        .header { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 0.875rem 1rem; position: sticky; top: 0; z-index: 99; }
        .header-content { max-width: 800px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
        .back-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 0.5rem 1rem; border-radius: 2rem; cursor: pointer; font-size: 0.9rem; }
        .page-title { font-size: 1.1rem; font-weight: 600; }

        .main { max-width: 800px; margin: 0 auto; padding: 1rem; }

        .card { background: white; border-radius: 1rem; padding: 1.25rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
        
        .section-title { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }

        .status-badge { display: inline-block; padding: 0.5rem 1rem; border-radius: 1rem; font-size: 0.9rem; font-weight: 600; }
        .status-badge.pending { background: rgba(245,158,11,0.1); color: var(--warning); }
        .status-badge.accepted { background: rgba(99,102,241,0.1); color: var(--primary); }
        .status-badge.shipped { background: rgba(16,185,129,0.1); color: var(--success); }
        .status-badge.completed { background: rgba(16,185,129,0.2); color: var(--success); }
        .status-badge.rejected, .status-badge.cancelled { background: rgba(239,68,68,0.1); color: var(--error); }

        .product-info { display: flex; gap: 1rem; }
        .product-img { width: 100px; height: 100px; border-radius: 0.5rem; object-fit: cover; background: var(--bg); }
        .product-detail { flex: 1; }
        .product-title { font-weight: 600; font-size: 1rem; margin-bottom: 0.5rem; }
        .product-price { color: var(--error); font-size: 1.1rem; font-weight: 600; }
        .product-role { font-size: 0.8rem; padding: 0.125rem 0.5rem; border-radius: 1rem; margin-left: 0.5rem; }
        .product-role.buyer { background: rgba(99,102,241,0.1); color: var(--primary); }
        .product-role.seller { background: rgba(16,185,129,0.1); color: var(--success); }

        .info-row { display: flex; justify-content: space-between; padding: 0.75rem 0; border-bottom: 1px solid var(--border); }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: var(--text-light); font-size: 0.9rem; }
        .info-value { font-size: 0.9rem; text-align: right; }

        .address-box { background: var(--bg); border-radius: 0.5rem; padding: 1rem; }
        .address-name { font-weight: 600; margin-bottom: 0.5rem; }
        .address-phone { font-size: 0.9rem; color: var(--text-light); margin-bottom: 0.5rem; }
        .address-detail { font-size: 0.9rem; color: var(--text-light); }

        .express-box { background: var(--bg); border-radius: 0.5rem; padding: 1rem; }
        .express-company { font-weight: 600; margin-bottom: 0.5rem; }
        .express-no { font-size: 1.1rem; font-weight: 600; color: var(--primary); }
        .track-btn { background: var(--primary); color: white; border: none; padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.85rem; cursor: pointer; margin-top: 0.5rem; }

        .action-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 1rem; border-top: 1px solid var(--border); display: flex; gap: 1rem; max-width: 800px; margin: 0 auto; }
        .btn { flex: 1; padding: 0.875rem; border: none; border-radius: 2rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }

        .form-group { margin-bottom: 1rem; }
        .form-label { display: block; font-size: 0.9rem; margin-bottom: 0.5rem; color: var(--text-light); }
        .form-input { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 0.5rem; font-size: 0.95rem; }
        .form-input:focus { outline: none; border-color: var(--primary); }
        .form-row { display: flex; gap: 1rem; }
        .form-row .form-group { flex: 1; }

        .loading { text-align: center; padding: 3rem; color: var(--text-light); }

        .contact-seller { display: flex; align-items: center; gap: 0.75rem; padding: 1rem; background: var(--bg); border-radius: 0.5rem; margin-top: 1rem; cursor: pointer; }
        .contact-seller:hover { background: var(--border); }
        .contact-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--secondary)); display: flex; align-items: center; justify-content: center; color: white; font-size: 1rem; }
        .contact-info { flex: 1; }
        .contact-name { font-weight: 600; font-size: 0.95rem; }
        .contact-hint { font-size: 0.8rem; color: var(--text-light); }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <button class="back-btn" onclick="goBack()">←</button>
            <span class="page-title">订单详情</span>
            <div style="width: 60px;"></div>
        </div>
    </header>

    <main class="main" id="main">
        <div class="loading">加载中...</div>
    </main>

    <script>
        let order = null;

        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkLoginAndLoad();
        });

        async function checkLoginAndLoad() {
            const loggedIn = await checkLoggedIn();
            if (!loggedIn) {
                window.location.href = '/auth';
                return;
            }
            loadOrder();
        }

        async function loadOrder() {
            const orderId = getQueryParam('id');
            if (!orderId) {
                document.getElementById('main').innerHTML = '<div class="loading">缺少订单ID</div>';
                return;
            }

            try {
                const res = await authFetch(`/api/orders/${orderId}`);
                const data = await res.json();
                
                if (data.success) {
                    order = data.order;
                    renderOrder();
                    
                    // 检查是否需要显示发货表单
                    const action = getQueryParam('action');
                    if (action === 'ship' && order.is_seller && order.status === 'accepted' && order.full_address) {
                        showShipForm();
                    }
                } else {
                    document.getElementById('main').innerHTML = '<div class="loading">订单不存在</div>';
                }
            } catch (e) {
                document.getElementById('main').innerHTML = '<div class="loading">加载失败</div>';
            }
        }

        function renderOrder() {
            const container = document.getElementById('main');
            
            const statusText = {
                pending: '待确认',
                accepted: '已接单',
                rejected: '已拒绝',
                shipped: '已发货',
                completed: '已完成',
                cancelled: '已取消'
            };

            container.innerHTML = `
                <!-- 订单状态 -->
                <div class="card">
                    <div class="section-title">订单状态</div>
                    <span class="status-badge ${order.status}">${statusText[order.status] || order.status}</span>
                </div>

                <!-- 商品信息 -->
                <div class="card">
                    <div class="section-title">商品信息</div>
                    <div class="product-info">
                        <img class="product-img" src="${getFirstImage(order.images)}" alt="" onclick="goToProduct()">
                        <div class="product-detail">
                            <div class="product-title">
                                ${order.title}
                                <span class="product-role ${order.is_buyer ? 'buyer' : 'seller'}">${order.is_buyer ? '买入' : '卖出'}</span>
                            </div>
                            <div class="product-price">¥${order.product_price}</div>
                        </div>
                    </div>
                    <div class="contact-seller" onclick="contactUser()">
                        <div class="contact-avatar">${order.is_buyer ? order.seller_avatar : order.buyer_avatar}</div>
                        <div class="contact-info">
                            <div class="contact-name">${order.is_buyer ? order.seller_name : order.buyer_name}</div>
                            <div class="contact-hint">点击发起私信</div>
                        </div>
                    </div>
                </div>

                <!-- 收货地址 -->
                <div class="card">
                    <div class="section-title">收货地址</div>
                    ${order.full_address ? `
                        <div class="address-box">
                            <div class="address-name">${order.buyer_name}</div>
                            <div class="address-phone">${order.buyer_phone}</div>
                            <div class="address-detail">${order.full_address}</div>
                        </div>
                    ` : `
                        <div class="address-box" style="text-align: center; color: var(--text-light);">
                            ${order.is_buyer && order.status === 'accepted' ? '请填写您的收货地址' : 
                              order.is_seller ? '买家还未填写收货地址' : '请等待卖家确认'}
                        </div>
                    `}
                    
                    ${order.is_buyer && order.status === 'accepted' && !order.full_address ? `
                        <button class="btn btn-primary" style="margin-top: 1rem;" onclick="showAddressForm()">填写收货地址</button>
                    ` : ''}
                </div>

                <!-- 快递信息 -->
                ${order.express_no ? `
                    <div class="card">
                        <div class="section-title">快递信息</div>
                        <div class="express-box">
                            <div class="express-company">${order.express_company}</div>
                            <div class="express-no">${order.express_no}</div>
                            <button class="track-btn" onclick="trackExpress('${order.express_company}', '${order.express_no}')">🔍 追踪物流</button>
                        </div>
                    </div>
                ` : ''}

                <!-- 订单信息 -->
                <div class="card">
                    <div class="section-title">订单信息</div>
                    <div class="info-row">
                        <span class="info-label">订单编号</span>
                        <span class="info-value">${order.id}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">下单时间</span>
                        <span class="info-value">${formatTime(order.created_at)}</span>
                    </div>
                    ${order.updated_at ? `
                        <div class="info-row">
                            <span class="info-label">更新时间</span>
                            <span class="info-value">${formatTime(order.updated_at)}</span>
                        </div>
                    ` : ''}
                </div>

                <!-- 发货表单（隐藏） -->
                <div id="shipForm" style="display: none;">
                    <div class="card">
                        <div class="section-title">填写快递信息</div>
                        <div class="form-group">
                            <label class="form-label">快递公司</label>
                            <select class="form-input" id="expressCompany">
                                <option value="">请选择快递公司</option>
                                <option value="顺丰速运">顺丰速运</option>
                                <option value="圆通快递">圆通快递</option>
                                <option value="中通快递">中通快递</option>
                                <option value="韵达快递">韵达快递</option>
                                <option value="申通快递">申通快递</option>
                                <option value="邮政EMS">邮政EMS</option>
                                <option value="京东快递">京东快递</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">快递单号</label>
                            <input type="text" class="form-input" id="expressNo" placeholder="请输入快递单号">
                        </div>
                        <div style="display: flex; gap: 1rem;">
                            <button class="btn btn-secondary" onclick="hideShipForm()">取消</button>
                            <button class="btn btn-primary" onclick="submitShip()">确认发货</button>
                        </div>
                    </div>
                </div>

                <!-- 收货地址表单（隐藏） -->
                <div id="addressForm" style="display: none;">
                    <div class="card">
                        <div class="section-title">填写收货地址</div>
                        <div class="form-group">
                            <label class="form-label">收货人姓名</label>
                            <input type="text" class="form-input" id="buyerName" placeholder="请输入收货人姓名">
                        </div>
                        <div class="form-group">
                            <label class="form-label">手机号码</label>
                            <input type="tel" class="form-input" id="buyerPhone" placeholder="请输入手机号码">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">省份</label>
                                <input type="text" class="form-input" id="buyerProvince" placeholder="如：广东省">
                            </div>
                            <div class="form-group">
                                <label class="form-label">城市</label>
                                <input type="text" class="form-input" id="buyerCity" placeholder="如：深圳市">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">区县</label>
                            <input type="text" class="form-input" id="buyerDistrict" placeholder="如：南山区">
                        </div>
                        <div class="form-group">
                            <label class="form-label">详细地址</label>
                            <input type="text" class="form-input" id="buyerDetail" placeholder="请输入详细地址">
                        </div>
                        <div style="display: flex; gap: 1rem;">
                            <button class="btn btn-secondary" onclick="hideAddressForm()">取消</button>
                            <button class="btn btn-primary" onclick="submitAddress()">保存地址</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function showShipForm() {
            document.getElementById('shipForm').style.display = 'block';
            document.getElementById('shipForm').scrollIntoView({ behavior: 'smooth' });
        }

        function hideShipForm() {
            document.getElementById('shipForm').style.display = 'none';
        }

        async function submitShip() {
            const expressCompany = document.getElementById('expressCompany').value;
            const expressNo = document.getElementById('expressNo').value.trim();

            if (!expressCompany || !expressNo) {
                alert('请填写完整的快递信息');
                return;
            }

            try {
                const res = await authFetch(`/api/orders/${order.id}/ship`, {
                    method: 'POST',
                    body: JSON.stringify({ express_company: expressCompany, express_no: expressNo })
                });
                
                // 检查 HTTP 状态码
                if (res.status === 401) {
                    alert('登录已过期，请重新登录');
                    localStorage.removeItem('auth_token');
                    window.location.href = '/auth';
                    return;
                }
                if (res.status === 403) {
                    alert('您没有权限执行此操作');
                    return;
                }
                
                const data = await res.json();

                if (data.success) {
                    alert('已发货');
                    loadOrder();
                } else {
                    alert(data.error || '发货失败');
                }
            } catch (e) {
                console.error('发货错误:', e);
                alert('网络错误: ' + e.message);
            }
        }

        function showAddressForm() {
            document.getElementById('addressForm').style.display = 'block';
            document.getElementById('addressForm').scrollIntoView({ behavior: 'smooth' });
        }

        function hideAddressForm() {
            document.getElementById('addressForm').style.display = 'none';
        }

        async function submitAddress() {
            const name = document.getElementById('buyerName').value.trim();
            const phone = document.getElementById('buyerPhone').value.trim();
            const province = document.getElementById('buyerProvince').value.trim();
            const city = document.getElementById('buyerCity').value.trim();
            const district = document.getElementById('buyerDistrict').value.trim();
            const detail = document.getElementById('buyerDetail').value.trim();

            if (!name || !phone || !province || !city || !district || !detail) {
                alert('请填写完整的收货信息');
                return;
            }

            try {
                const res = await authFetch(`/api/orders/${order.id}/address`, {
                    method: 'PUT',
                    body: JSON.stringify({ name, phone, province, city, district, detail })
                });
                const data = await res.json();

                if (data.success) {
                    alert('地址已保存');
                    loadOrder();
                } else {
                    alert(data.error || '保存失败');
                }
            } catch (e) {
                alert('网络错误');
            }
        }

        function contactUser() {
            console.log('contactUser Debug:');
            console.log('  order.is_buyer:', order.is_buyer);
            console.log('  order.is_seller:', order.is_seller);
            console.log('  order.seller_uid:', order.seller_uid);
            console.log('  order.buyer_uid:', order.buyer_uid);
            
            const targetUid = order.is_buyer ? order.seller_uid : order.buyer_uid;
            console.log('  targetUid:', targetUid);
            console.log('  即将跳转:', `/message?uid=${targetUid}&product_id=${order.product_id}`);
            
            window.location.href = `/message?uid=${targetUid}&product_id=${order.product_id}`;
        }

        function goToProduct() {
            window.location.href = `/detail?id=${order.product_id}`;
        }

        function formatTime(timeStr) {
            const date = new Date(timeStr);
            return date.toLocaleString('zh-CN');
        }

        function getFirstImage(images) {
            if (!images) return 'https://picsum.photos/100/100';
            if (typeof images === 'string') {
                try {
                    const arr = JSON.parse(images);
                    return arr[0] || 'https://picsum.photos/100/100';
                } catch {
                    return images || 'https://picsum.photos/100/100';
                }
            }
            return images[0] || 'https://picsum.photos/100/100';
        }

        function goBack() {
            window.location.href = '/orders';
        }
    </script>
</body>
</html>
